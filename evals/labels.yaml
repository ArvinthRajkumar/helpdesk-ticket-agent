# Hand labels for the eval set. Written from ticket text only, BEFORE any agent run.
# Drafted by Claude Code, status reviewed by the author, no edits.
# Labeller (Claude) and agent (Gemini) are different model families, but labels are one reading of ten tickets.
#
# Selection logic (deterministic, re-runnable on a new CSV with new labels):
#   1. Sort tickets by id. Hand-assign a category to every ticket while reading.
#   2. Take the lowest id for each of the 5 categories (5 slots).
#   3. Add the 3 hard cases named in the brief: injection, multi-intent, should-escalate
#      (TCK-1012, TCK-1010, TCK-1014).
#   4. Fill to 10 with the next lowest id per category in round-robin order (bug, question).
# Result: bug 2, billing 4, question 2, feature_request 1, other 1. Five are hard cases.
#
# Fields: category, priority (urgent|high|medium|low), should_escalate (true means a human
# must look at it before any automated draft or queue routing, so the expected route is
# human_review), note.
# Priority follows the rubric in prompts/triage.md, which is my rubric, not the client's.

status: reviewed
labelled_by: Claude Code, before first agent run
reviewed_by: the author (confirmed unchanged after review)

tickets:
  TCK-1001:
    category: bug
    priority: urgent
    should_escalate: false
    note: Login outage, 40 people blocked, delivery today. Clear bug for engineering.
  TCK-1002:
