# USD per million tokens, paid tier, standard (not batch) rates.
# Source: https://ai.google.dev/gemini-api/docs/pricing (now served from
# https://aistudio.google.com/docs/pricing), checked 2026-11-15.
# Output price includes thinking tokens, so cost.py bills thinking as output.
# cached_input is what Google charges for context cache hits. cost.py does not apply it: cached
# tokens are a subset of prompt_token_count and are priced as plain input, the conservative
# choice. Batch API is 50 percent off both input and output. Not used here, see README.
# Free tier: both models are free of charge with lower rate limits, and free-tier content is
# used to improve Google's products. Costs below are list prices regardless of the tier used.

models:
  gemini-3.1-flash-lite:
    input: 0.25
    output: 1.50
    cached_input: 0.025
  gemini-3.8-flash:
    # Introductory prices through 2026-12-31. cost.py switches to the price_change block on
    # its effective date, so a run after that date is priced at the doubled rates.
    input: 0.75
    output: 3.75
    cached_input: 0.075
    price_change:
      effective: 2027-01-01
      input: 1.50
      output: 7.50
      cached_input: 0.15
