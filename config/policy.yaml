# Routing thresholds and model settings. Code in src/ticket_agent/policy.py reads this.
# Env vars TICKET_AGENT_TRIAGE_MODEL and TICKET_AGENT_DRAFT_MODEL override the models.

models:
  triage: gemini-3.1-flash-lite
  draft: gemini-3.1-flash-lite

# Gemini 3 thinking is controlled by thinking_level (never thinking_budget). minimal is the
# cheapest level and enough for single-ticket classification. Some models do not accept it:
# gemini-3.8-flash supports low, medium and high only, so it gets an override below.
thinking_level: minimal
thinking_level_by_model:
  gemini-3.8-flash: low

# max_output_tokens bounds thinking plus the answer, so leave plenty of room above the JSON.
# A MAX_TOKENS finish is treated as a failure and the ticket goes to a human.
max_tokens:
  triage: 4096
  draft: 4096

# Client-side throttle. Free-tier limits are per project and only visible in AI Studio, so
# this stays conservative. Raise it on the paid tier.
max_rpm: 10
# SDK attempts for 429 and 503 with exponential backoff. These never count as a ticket failure.
retry_attempts: 5

# A run stops after this many consecutive triage failures. A wrong model id or key fails
# every ticket the same way and there is no point paying for 30 of them.
max_consecutive_failures: 3

routing:
  # Drafts and queue routing only for languages the team can review quickly.
  allowed_languages: [en]
  # Medium confidence is fine for a medium or low priority ticket. On these it is not.
  escalate_priorities_on_medium_confidence: [urgent, high]
  # Where a confident ticket goes. No queue for question (draft) or other (human).
  queues:
    bug: engineering
    billing: billing
    feature_request: product
