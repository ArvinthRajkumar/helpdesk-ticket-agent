# Model settings and policy thresholds. src/ticket_agent/policy.py reads this file.
# TICKET_AGENT_MODEL overrides the model for every call without editing this file.

model: gemini-3.1-flash-lite

# Gemini 3 thinking is controlled by thinking_level (never thinking_budget). minimal is the
# cheapest level. Some models do not accept it, so a per-model override is possible.
thinking_level: minimal
thinking_level_by_model:
  gemini-3.8-flash: low

# max_output_tokens bounds thinking plus the answer. A MAX_TOKENS finish is a failure and the
# ticket goes to a human, so leave room above the expected JSON.
max_tokens: 4096

# Client-side cap on Gemini requests per minute, and SDK attempts on 429 and 503 counting the
# first request. This backoff is separate from the helpdesk's.
max_rpm: 30
retry_attempts: 4

# The run stops after this many tickets in a row hit a hard failure (model unavailable or a
# post that failed after retries). The same cause usually fails every ticket.
max_consecutive_failures: 3

# The model reports a categorical confidence. These numbers are what the API receives. They
# are a fixed mapping, not a calibrated probability.
confidence_scores:
  high: 0.9
  medium: 0.6
  low: 0.3

# Fallback handoff when the model is unavailable and the detector cannot tell the language.
# Most of the client's customers write Dutch.
default_language: nl
