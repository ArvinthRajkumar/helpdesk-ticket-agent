[project]
name = "ticket-agent"
version = "0.1.0"
description = "Support ticket triage agent: classify, prioritise, draft, escalate, log."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
ticket-agent = "ticket_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
